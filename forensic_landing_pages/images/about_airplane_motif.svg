<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" fill="none" class="about-flight-svg">
  <defs>
    <linearGradient id="planeBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="contrailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="planeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Looping Dashed Flight Contrail -->
  <path d="M 30 290 C 70 340, 130 330, 150 260 C 170 190, 110 130, 150 80 C 190 30, 270 110, 310 90 C 350 70, 380 40, 420 50" 
        stroke="url(#contrailGrad)" stroke-width="2.5" stroke-dasharray="8 8" stroke-linecap="round" />

  <!-- Secondary subtle wave trail -->
  <path d="M 50 310 C 110 330, 160 250, 200 170 C 240 90, 300 100, 380 70" 
        stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45" stroke-linecap="round" />

  <!-- Animated Floating Airplane Group (Anchored at end of contrail) -->
  <g class="upDown" filter="url(#planeGlow)" transform="translate(410, 45) rotate(24) scale(0.85)">
    <!-- Main Fuselage -->
    <path d="M 0 -48 C 6 -35, 8 20, 7 45 C 5 48, -5 48, -7 45 C -8 20, -6 -35, 0 -48 Z" fill="url(#planeBodyGrad)" />
    <!-- Nosecone Highlight -->
    <path d="M 0 -48 C 3 -38, -3 -38, 0 -48 Z" fill="#38bdf8" />
    <!-- Swept Wings -->
    <path d="M 0 -8 L 52 24 C 55 27, 48 30, 42 29 L 6 12 L -6 12 L -42 29 C -48 30, -55 27, -52 24 L 0 -8 Z" fill="#0284c7" />
    <!-- Jet Engines -->
    <rect x="18" y="10" width="6" height="15" rx="3" fill="#0369a1" />
    <rect x="-24" y="10" width="6" height="15" rx="3" fill="#0369a1" />
    <!-- Tail Fin (Horizontal Stabilizers) -->
    <path d="M 0 34 L 20 48 L 16 52 L 0 46 L -16 52 L -20 48 L 0 34 Z" fill="#0369a1" />
    <!-- Vertical Stabilizer Rudder -->
    <path d="M -1.5 28 L 1.5 28 L 3 46 L -3 46 Z" fill="#38bdf8" />
    <!-- Cockpit Glass -->
    <path d="M -3 -36 Q 0 -40 3 -36 Q 3 -32 0 -32 Q -3 -32 -3 -36 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>